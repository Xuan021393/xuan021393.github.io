<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>♻️ AI環保小偵探 ♻️</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <style>
    body {
      font-family: "Comic Sans MS", sans-serif;
      text-align: center;
      background: url("images/123.jpg") no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      padding: 30px;
    }

    .main-card {
      background: rgba(255, 255, 255, 0.9);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      color: #388e3c;
    }

    .button-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
      margin-top: 20px;
    }

    button {
      padding: 10px 20px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      color: white;
      cursor: pointer;
      min-width: 180px;
      transition: transform 0.2s ease;
    }

    button:hover {
      transform: scale(1.05);
    }

    #scan-button {
      background-color: #81c784;
    }
    #scan-button:hover {
      background-color: #66bb6a;
    }

    #challenge-button {
      background-color: #f06292;
    }
    #challenge-button:hover {
      background-color: #ec407a;
    }

    #puzzle-button {
      background-color: #ba68c8;
    }
    #puzzle-button:hover {
      background-color: #ab47bc;
    }

    #monopoly-button {
      background-color: #ffb74d;
    }
    #monopoly-button:hover {
      background-color: #ffa726;
    }

    #webcam-container {
      margin: 20px auto;
    }

    #result {
      font-size: 20px;
      font-weight: bold;
      color: #1976d2;
      margin-top: 15px;
    }

    #count {
      font-size: 18px;
      color: #2e7d32;
      margin-top: 5px;
    }

    #card-container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 20px;
    }

    .card {
      border: 2px solid #aed581;
      border-radius: 15px;
      padding: 10px;
      width: 150px;
      background: #f1f8e9;
      box-shadow: 2px 2px 6px #ccc;
      animation: fadeInUp 0.5s ease;
    }

    .card img {
      width: 100%;
      height: auto;
      border-radius: 10px;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
</head>
<body>
  <h1>♻️ AI環保小偵探 ♻️</h1>
  <div class="main-card">
    <div id="webcam-container"></div>

    <div class="button-row">
      <button id="scan-button" onclick="predict()"><i class="fas fa-search"></i> 掃描看看</button>

      <a href="http://localhost:63342/B11108042/ai-recycle-game/index.html" target="_blank">
        <button id="challenge-button"><i class="fas fa-globe"></i> 分類達人大挑戰</button>
      </a>

      <a href="http://localhost:63342/B11108042/ai-recycle-puzzle/index.html" target="_blank">
        <button id="puzzle-button"><i class="fas fa-puzzle-piece"></i> 環保拼圖去</button>
      </a>

      <a href="http://localhost:63342/B11108042/eco-monopol/index.html?_ijt=29vdiu1jb1n9leauvn6fochn3e&_ij_reload=RELOAD_ON_SAVE" target="_blank">
        <button id="monopoly-button"><i class="fas fa-dice"></i> 環保大富翁</button>
      </a>
    </div>

    <p id="result">請點擊按鈕開始分類</p>
    <p id="count">今日已分類：0 項</p>

    <h2>🎉 已解鎖知識卡</h2>
    <div id="card-container"></div>
  </div>

  <audio id="correct-sound" src="audio/correct.mp3" preload="auto"></audio>
  <audio id="background-music" src="audio/background.mp3" autoplay loop></audio>

  <script src="script.js"></script>
</body>
</html>
