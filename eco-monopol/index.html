<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>環保知識大富翁</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>環保知識大富翁</h1>

  <div class="board-container">
    <img src="image/board.png" alt="大富翁棋盤" class="board" />
    <img id="player" src="image/player.png" alt="玩家" />
  </div>

  <div class="controls">
    <button id="rollBtn">🎲 擲骰子</button>
    <div id="dice-container">
      <img id="dice" src="image/dice_1.png" alt="骰子" />
    </div>
    <div id="question"></div>
    <div class="choices" id="choices"></div>
    <div id="result"></div>
  </div>

  <!-- ✅ 正確的音效路徑 -->
  <audio id="audio-roll" src="audio/dice_roll.mp3"></audio>
  <audio id="audio-correct" src="audio/correct.mp3"></audio>
  <audio id="audio-wrong" src="audio/wrong.mp3"></audio>

  <script src="script.js"></script>
</body>
</html>
